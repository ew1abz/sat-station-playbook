---
- name: Find USB Ethernet adapter
  ansible.windows.win_shell: |
    $adapter = Get-NetAdapter -Physical | Where-Object {
        (Get-NetAdapterHardwareInfo -Name $_.Name -ErrorAction SilentlyContinue).BusType -eq 'USB'
    } | Select-Object -First 1
    if (-not $adapter) { Write-Error "No USB Ethernet adapter found — plug in the USB-Eth dongle"; exit 1 }
    $adapter.Name
  register: usb_adapter_name
  changed_when: false

- name: Check whether static IP is already set
  ansible.windows.win_shell: |
    $ip = Get-NetIPAddress -InterfaceAlias "{{ usb_adapter_name.stdout | trim }}" `
          -IPAddress "{{ usb_eth_ip }}" -AddressFamily IPv4 -ErrorAction SilentlyContinue
    if ($ip) { "present" } else { "absent" }
  register: usb_ip_state
  changed_when: false

- name: Set static IP on USB Ethernet adapter
  ansible.windows.win_shell: |
    $name = "{{ usb_adapter_name.stdout | trim }}"
    Get-NetIPAddress -InterfaceAlias $name -AddressFamily IPv4 -ErrorAction SilentlyContinue |
        Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue
    Set-NetIPInterface -InterfaceAlias $name -Dhcp Disabled -ErrorAction SilentlyContinue
    New-NetIPAddress -InterfaceAlias $name `
        -IPAddress "{{ usb_eth_ip }}" -PrefixLength {{ usb_eth_prefix }}
  when: (usb_ip_state.stdout | trim) == "absent"
