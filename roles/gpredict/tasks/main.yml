---
- name: Check if Gpredict is already installed
  ansible.windows.win_stat:
    path: "{{ gpredict_install_dir }}\\gpredict.exe"
  register: gpredict_bin

- name: Download Gpredict ZIP
  ansible.windows.win_get_url:
    url: "{{ gpredict_zip_url }}"
    dest: "C:\\Temp\\gpredict.zip"
    follow_redirects: all
  when: not gpredict_bin.stat.exists

- name: Extract Gpredict ZIP to install directory
  community.windows.win_unzip:
    src: "C:\\Temp\\gpredict.zip"
    dest: "C:\\Temp\\gpredict_stage"
    creates: "C:\\Temp\\gpredict_stage"
  when: not gpredict_bin.stat.exists

- name: Create Gpredict install directory
  ansible.windows.win_file:
    path: "{{ gpredict_install_dir }}"
    state: directory
  when: not gpredict_bin.stat.exists

- name: Copy Gpredict from staging to install directory
  ansible.windows.win_shell: |
    $staged = Get-ChildItem -Path "C:\Temp\gpredict_stage" -Directory |
        Select-Object -First 1 -ExpandProperty FullName
    robocopy "$staged" "{{ gpredict_install_dir }}" /E | Out-Null
    exit 0
  args:
    creates: "{{ gpredict_install_dir }}\\gpredict.exe"
  when: not gpredict_bin.stat.exists

- name: Ensure Gpredict config directory exists
  ansible.windows.win_file:
    path: "{{ ansible_env.USERPROFILE }}\\Gpredict"
    state: directory

- name: Ensure Gpredict satdata directory exists
  ansible.windows.win_file:
    path: "{{ ansible_env.USERPROFILE }}\\Gpredict\\satdata"
    state: directory

- name: Ensure Gpredict hwconf directory exists
  ansible.windows.win_file:
    path: "{{ ansible_env.USERPROFILE }}\\Gpredict\\hwconf"
    state: directory

# Only manage DEFAULT_QTH — Gpredict owns the rest of gpredict.cfg
# (window position, last-opened module, etc.) and rewrites it at runtime.
- name: Ensure DEFAULT_QTH is set in gpredict.cfg
  ansible.windows.win_shell: |
    $cfg = "{{ ansible_env.USERPROFILE }}\Gpredict\gpredict.cfg"
    $line = "DEFAULT_QTH={{ operator_callsign }}.qth"
    if (Test-Path $cfg) {
        $content = Get-Content $cfg -Raw
        if ($content -match 'DEFAULT_QTH=') {
            $content = $content -replace 'DEFAULT_QTH=.*', $line
        } else {
            $content = $content.TrimEnd() + "`r`n" + $line + "`r`n"
        }
        Set-Content $cfg $content -NoNewline
    } else {
        Set-Content $cfg ("[GLOBAL]`r`n" + $line + "`r`n")
    }
  changed_when: false

- name: Ensure Gpredict modules directory exists
  ansible.windows.win_file:
    path: "{{ ansible_env.USERPROFILE }}\\Gpredict\\modules"
    state: directory

- name: Deploy station QTH file
  ansible.windows.win_template:
    src: station.qth.j2
    dest: "{{ ansible_env.USERPROFILE }}\\Gpredict\\{{ operator_callsign }}.qth"

- name: Deploy satellite modules
  ansible.windows.win_template:
    src: "modules/{{ item }}.j2"
    dest: "{{ ansible_env.USERPROFILE }}\\Gpredict\\modules\\{{ item }}"
  loop:
    - FM.mod
    - Linear.mod

- name: Deploy FT-897 radio interface (uplink)
  ansible.windows.win_template:
    src: ft897.rig.j2
    dest: "{{ ansible_env.USERPROFILE }}\\Gpredict\\hwconf\\ft897.rig"

- name: Deploy FTX-1 radio interface (downlink)
  ansible.windows.win_template:
    src: ftx1.rig.j2
    dest: "{{ ansible_env.USERPROFILE }}\\Gpredict\\hwconf\\ftx1.rig"

- name: Deploy rotator interface
  ansible.windows.win_template:
    src: rotator.rot.j2
    dest: "{{ ansible_env.USERPROFILE }}\\Gpredict\\hwconf\\rotator.rot"

- name: Create Gpredict desktop shortcut
  community.windows.win_shortcut:
    src: "{{ gpredict_install_dir }}\\gpredict.exe"
    dest: 'C:\Users\Public\Desktop\Gpredict.lnk'
    description: "Gpredict satellite tracking"
    icon: "{{ gpredict_install_dir }}\\gpredict.exe,0"
