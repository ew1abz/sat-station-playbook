---
- name: Check if Gpredict installer cache exists
  ansible.windows.win_stat:
    path: 'C:\Temp\gpredict-setup.exe'
  register: gpredict_installer

- name: Uninstall Gpredict silently (NSIS /S flag)
  ansible.windows.win_package:
    path: 'C:\Temp\gpredict-setup.exe'
    arguments: "/S"
    state: absent
  when: gpredict_installer.stat.exists

- name: Remove Gpredict install directory
  ansible.windows.win_file:
    path: "{{ gpredict_install_dir }}"
    state: absent

- name: Remove Gpredict hwconf files
  ansible.windows.win_file:
    path: "{{ ansible_env.APPDATA }}\\Gpredict\\hwconf\\{{ item }}"
    state: absent
  loop:
    - ft897.rig
    - ftx1.rig
    - rotator.rot

- name: Remove Gpredict config file
  ansible.windows.win_file:
    path: "{{ ansible_env.APPDATA }}\\Gpredict\\gpredict.cfg"
    state: absent

- name: Remove Gpredict installer cache
  ansible.windows.win_file:
    path: 'C:\Temp\gpredict-setup.exe'
    state: absent
