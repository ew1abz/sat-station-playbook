---
- name: Provision satellite tracking station
  hosts: sat_station
  gather_facts: true

  pre_tasks:
    - name: Verify Windows target
      ansible.builtin.assert:
        that: ansible_os_family == "Windows"
        fail_msg: "This playbook targets Windows only."

  roles:
    - winrm_baseline
    - net_adapter
    - hamlib
    - gpredict
    - tle_update

